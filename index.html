<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanilla Voyage | Perfumes Árabes</title>
<style>
:root{--rose:#d8a1ad;--gold:#b99355;--cream:#fffaf7;--ink:#3c3032}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}
header{background:linear-gradient(135deg,#fff8f6,#f4e1e4);padding:30px 18px 18px;text-align:center;border-bottom:1px solid #ead2d6}
.logo{font-family:Georgia,serif;font-size:42px;color:#9f7251;margin:0}.tag{margin:7px 0 22px;color:#765f60}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}nav button{border:1px solid #d8b9bd;background:white;color:#76555a;border-radius:24px;padding:10px 18px;cursor:pointer}nav button.active{background:var(--rose);color:white}
main{max-width:1150px;margin:auto;padding:30px 18px 50px}.hero{text-align:center;margin-bottom:25px}.hero h1{font-family:Georgia,serif;font-size:34px;margin:0 0 8px}.hero p{margin:0;color:#756568}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px #5b34340f;border:1px solid #f0e1e3}.card img{width:100%;height:260px;object-fit:cover;background:#fff}.info{padding:15px}.info h3{font-family:Georgia,serif;margin:0 0 7px;font-size:20px}.cat{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#a07878}.price{margin-top:12px;color:#9b7040;font-weight:bold}.soon{font-weight:normal;color:#8a7779}
.empty{padding:50px 20px;text-align:center;background:white;border-radius:18px;border:1px dashed #d9c1c5}.empty h2{font-family:Georgia,serif}
footer{text-align:center;padding:25px;color:#8a7476;font-size:13px;border-top:1px solid #eadfe0}
@media(max-width:600px){.logo{font-size:34px}.hero h1{font-size:28px}.card img{height:230px}}
</style></head>
<body>
<header><h1 class="logo">Vanilla Voyage</h1><div class="tag">Perfumes árabes &amp; cuidados perfumados</div>
<nav><button class="active" data-cat="perfumes">Perfumes</button><button data-cat="cremes">Cremes Corporais</button><button data-cat="coreanos">Produtos Coreanos</button></nav></header>
<main><section class="hero"><h1 id="title">Perfumes Árabes</h1><p id="subtitle">Escolha sua fragrância favorita. Preços serão adicionados em breve.</p></section><div id="products" class="grid"></div></main>
<footer>Vanilla Voyage • Produtos originais • Preços em breve</footer>
<script>
const items=[
['garden.jpg','Sabah Al Ward – Garden of Eden','perfumes'],['yara.jpg','Yara – Lattafa','perfumes'],['victoria.jpg','Victoria – Lattafa','perfumes'],['maleka.jpg','Club de Nuit Maleka – Armaf','perfumes'],['veneno.jpg','Veneno Branco – French Avenue','perfumes'],['tharwah-gold.jpg','Tharwah Gold – Lattafa','perfumes'],['vanilla-voyage.jpg','Vanilla Voyage – Maison Asrar','perfumes'],['marshmallow-blush.jpg','Marshmallow Blush – Paris Corner','perfumes'],['azzam.jpg','Azzam – Paris Corner','perfumes'],['dettiah.jpg','Sabah Al Ward – Dettiah','perfumes'],['yara-elixir.jpg','Yara Elixir – Body Cream','cremes'],['sabah-creme.jpg','Sabah Al Ward – Body Cream','cremes'],['atheri-creme.jpg','Atheri – Body Cream','cremes']];
const box=document.getElementById('products'), title=document.getElementById('title'), subtitle=document.getElementById('subtitle');
function render(cat){box.innerHTML='';let list=items.filter(x=>x[2]===cat);if(cat==='coreanos'){title.textContent='Produtos Coreanos';subtitle.textContent='Em breve teremos novidades coreanas na Vanilla Voyage.';box.innerHTML='<div class="empty"><h2>Novidades em breve ✨</h2><p>Estamos preparando essa categoria.</p></div>';return}
title.textContent=cat==='perfumes'?'Perfumes Árabes':'Cremes Corporais';subtitle.textContent='Escolha seu produto favorito. Preços serão adicionados após a compra do estoque.';list.forEach(([img,name])=>{box.insertAdjacentHTML('beforeend',`<article class="card"><img src="img/${img}" alt="${name}"><div class="info"><div class="cat">${cat==='perfumes'?'Perfume':'Creme corporal'}</div><h3>${name}</h3><div class="price"><span class="soon">Preço em breve</span></div></div></article>`)});}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.cat)});render('perfumes');
</script></body></html>
