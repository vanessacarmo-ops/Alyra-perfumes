<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arabian Nights | Perfumes Árabes</title>

<style>
:root{
  --rosa:#b99355;
  --dourado:#d4af37;
  --preto:#0b0b0b;
  --texto:#f5f5f5;
  --cinza:#aaa;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f5f2;
  color:#222;
}

header{
  background:linear-gradient(135deg,#050505,#1a1a1a);
  padding:30px 18px 22px;
  text-align:center;
  border-bottom:2px solid var(--dourado);
}

.logo{
  font-family:Georgia,serif;
  font-size:46px;
  color:var(--rosa);
  margin:0;
  letter-spacing:2px;
}

.tag{
  margin:7px 0 22px;
  color:#c9b89b;
  font-size:15px;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

nav button{
  border:1px solid #b99355;
  border-radius:25px;
  padding:11px 20px;
  cursor:pointer;
  background:#111;
  color:#ddd;
  font-size:14px;
}

nav button.active,
nav button:hover{
  background:var(--rosa);
  color:white;
}

main{
  max-width:1150px;
  margin:auto;
  padding:35px 18px 60px;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.hero h1{
  font-family:Georgia,serif;
  font-size:34px;
  color:#765668;
  margin:0 0 10px;
}

.hero p{
  color:#777;
  font-size:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card{
  background:#111;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 18px #bbb;
  border:1px solid #ddd;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  background:white;
  display:block;
}

.info{
  padding:16px;
}

.info h3{
  font-family:Georgia,serif;
  margin:0 0 8px;
  font-size:20px;
  color:white;
}

.cat{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--rosa);
  font-weight:bold;
}

.price{
  margin-top:12px;
  color:#d4af37;
  font-weight:bold;
}

.soon{
  color:#aaa;
  font-weight:normal;
}

.empty{
  padding:50px 20px;
  text-align:center;
  background:#111;
  border-radius:18px;
  border:1px dashed #b99355;
  color:#ccc;
}

footer{
  text-align:center;
  padding:28px;
  color:#777;
  font-size:13px;
  border-top:1px solid #ddd;
  background:#fff;
}

@media(max-width:600px){
  .logo{
    font-size:36px;
  }

  .hero h1{
    font-size:28px;
  }

  .card img{
    height:230px;
  }
}
</style>
</head>

<body>

<header>

<h1 class="logo">Arabian Nights</h1>

<div class="tag">
Perfumes árabes & cuidados perfumados
</div>

<nav>
<button class="active" data-cat="perfumes">Perfumes</button>
<button data-cat="cremes">Cremes Corporais</button>
<button data-cat="coreanos">Produtos Coreanos</button>
</nav>

</header>

<main>

<section class="hero">
<h1 id="title">Arabian Nights </h1>
<p id="subtitle">
Descubra fragrâncias exclusivas e produtos selecionados para você.
</p>
</section>

<div class="grid" id="products"></div>

</main>

<footer>
Arabian Nights • Produtos originais • Preços em breve
</footer>

<script>

const items = [

/* PERFUMES */

["garden.jpg","Sabah Al Ward – Garden of Eden","perfumes"],

["yara.jpg","Yara – Lattafa","perfumes"],

["WhatsApp Image 2026-08-09 at 17.10.53.jpeg","Victoria – Lattafa","perfumes"],

["maleka.jpg","Club de Nuit Maleka – Armaf","perfumes"],

["veneno.jpg","Veneno Branco – French Avenue","perfumes"],

["tharwah-gold.jpg","Tharwah Gold – Lattafa","perfumes"],

["vanilla-voyage.jpg","Vanilla Voyage – Maison Asrar","perfumes"],

["marshmallow-blush.jpg","Marshmallow Blush – Paris Corner","perfumes"],

["azzam.jpg","Azzam – Paris Corner","perfumes"],

["dettiah.jpg","Sabah Al Ward – Dettiah","perfumes"],


/* CREMES */

["yara-elixir.jpg","Yara Elixir – Body Cream","cremes"],

["sabah-creme.jpg","Sabah Al Ward – Body Cream","cremes"],

["atheri-creme.jpg","Atheri – Body Cream","cremes"]

];


const box = document.getElementById("products");

const title = document.getElementById("title");

const subtitle = document.getElementById("subtitle");


function render(cat){

box.innerHTML="";

if(cat==="coreanos"){

title.textContent="Produtos Coreanos";

subtitle.textContent="Em breve teremos novidades de cuidados e beleza coreanos.";

box.innerHTML=`
<div class="empty">
<h2>🇰🇷 Produtos Coreanos</h2>
<p>Novidades chegando em breve.</p>
</div>
`;

return;
}


title.textContent =
cat==="perfumes"
? "Perfumes Árabes"
: "Cremes Corporais";


subtitle.textContent =
"Escolha seu produto favorito. Preços serão adicionados após a compra do estoque.";


const list = items.filter(x => x[2] === cat);


list.forEach(item => {

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<img src="${item[0]}" alt="${item[1]}"
onerror="this.style.display='none'">

<div class="info">

<div class="cat">
${cat==="perfumes" ? "Perfume" : "Creme Corporal"}
</div>

<h3>${item[1]}</h3>

<div class="price">
<span class="soon">Preço em breve</span>
</div>

</div>
`;

box.appendChild(card);

});

}


document.querySelectorAll("nav button").forEach(button=>{

button.addEventListener("click",()=>{

document.querySelectorAll("nav button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

render(button.dataset.cat);

});

});


render("perfumes");

</script>

</body>
</html>
